<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkinHouse — Профиль</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="profile">
  <div class="app-shell">
    <header class="app-header">
      <a class="logo" href="index.html">Skin<span>House</span></a>
      <nav class="main-nav">
        <a href="index.html" data-page="cases">Кейсы</a>
        <a href="leaderboard.html" data-page="leaderboard">Лидеры</a>
        <a href="giveaways.html" data-page="giveaways">Розыгрыши</a>
        <a href="upgrade.html" data-page="upgrade">Апгрейд</a>
        <a href="profile.html" data-page="profile">Профиль</a>
      </nav>
      <div class="header-actions">
        <div class="balance-chip">
          <div>
            <small>Баланс</small>
            <strong id="headerBalance">₽0.00</strong>
          </div>
          <button class="btn primary" id="depositBtn">Пополнить</button>
        </div>
        <button class="icon-btn" id="logoutBtn" title="Выйти из аккаунта">
          <span class="icon icon-logout"></span>
        </button>
        <button class="user-chip" type="button" id="accountManager">
          <img id="headerAvatar" src="https://avatars.githubusercontent.com/u/1?v=4" alt="avatar" />
          <div>
            <p class="user-name" id="headerUser">Гость</p>
            <small id="userExp">0 XP</small>
          </div>
        </button>
      </div>
    </header>

    <main>
      <section class="profile-hero">
        <div>
          <h1 id="profileName">—</h1>
          <p class="muted">Steam ID: <span id="profileId">—</span></p>
          <div class="profile-stats">
            <div><small>Баланс</small><strong id="profileBalance">₽0.00</strong></div>
            <div><small>XP</small><strong id="profileXp">0</strong></div>
            <div><small>Кейсов</small><strong id="profileCases">0</strong></div>
            <div><small>Апгрейдов</small><strong id="profileUpgrades">0</strong></div>
          </div>
        </div>
        <div class="profile-actions">
          <button class="btn secondary" id="copyTrade">Скопировать трейд</button>
          <button class="btn ghost" id="sellAll">Продать всё</button>
        </div>
      </section>

      <section class="inventory-panel">
        <div class="inventory-tabs" id="inventoryFilters">
          <button class="chip active" data-filter="all">Все</button>
          <button class="chip" data-filter="available">Доступно</button>
          <button class="chip" data-filter="sold">Продано</button>
          <button class="chip" data-filter="upgraded">Апгрейд</button>
          <button class="chip" data-filter="withdrawn">Выведено</button>
        </div>
        <div class="inventory-grid" id="profileInventory"></div>
      </section>
    </main>

    <footer>
      <p>© 2025 SkinHouse. Все права защищены.</p>
      <div class="footer-links">
        <a href="#">Пользовательское соглашение</a>
        <a href="#">Поддержка</a>
      </div>
    </footer>
  </div>

  <div class="modal" id="accountModal" aria-hidden="true">
    <div class="modal-content large">
      <button class="modal-close" data-close-modal>&times;</button>
      <h3>Аккаунт</h3>
      <p class="muted">Войдите через Steam или создайте локальный аккаунт.</p>
      <div class="modal-tabs" role="tablist">
        <button class="chip active" data-tab="steam">Steam</button>
        <button class="chip" data-tab="login">Логин</button>
        <button class="chip" data-tab="register">Регистрация</button>
      </div>
      <form id="steamForm" class="modal-form">
        <label>Steam ID<input type="text" id="steamProfile" required /></label>
        <label>Ник<input type="text" id="steamNick" required /></label>
        <button class="btn primary" type="submit">Авторизоваться через Steam</button>
      </form>
      <form id="loginForm" class="modal-form hidden" autocomplete="off">
        <label>Никнейм<input type="text" id="loginName" required /></label>
        <label>Пароль<input type="password" id="loginPassword" required /></label>
        <button class="btn primary" type="submit">Войти</button>
      </form>
      <form id="registerForm" class="modal-form hidden" autocomplete="off">
        <label>Никнейм<input type="text" id="registerName" required minlength="3" /></label>
        <label>Пароль<input type="password" id="registerPassword" required minlength="4" /></label>
        <label>Повтор<input type="password" id="registerConfirm" required minlength="4" /></label>
        <button class="btn primary" type="submit">Создать аккаунт</button>
      </form>
      <div class="account-list" id="accountList"></div>
    </div>
  </div>

  <div class="modal" id="depositModal" aria-hidden="true">
    <div class="modal-content">
      <button class="modal-close" data-close-modal>&times;</button>
      <h3>Пополнение баланса</h3>
      <form id="depositForm" class="modal-form">
        <label>Сумма<input type="number" id="depositAmount" min="5" step="5" value="100" /></label>
        <label>Способ
          <select id="depositMethod">
            <option value="card">Карта</option>
            <option value="qiwi">QIWI</option>
            <option value="crypto">Crypto</option>
          </select>
        </label>
        <button class="btn primary" type="submit">Пополнить</button>
      </form>
    </div>
  </div>

  <div class="case-spinner" id="caseSpinner" aria-hidden="true">
    <div class="spinner-content">
      <button class="modal-close" data-close-spinner>&times;</button>
      <div class="spinner-track-wrapper">
        <div class="spinner-track" id="spinnerTrack"></div>
        <div class="spinner-pointer"></div>
      </div>
      <div class="spinner-result" id="spinnerResult"></div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="script.js"></script>
</body>
</html>
